[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-study"
version = "2026.8.0"
description = "A 37-chapter, executable AI Agent engineering course"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "openai>=2.52,<3",
  "python-dotenv>=1.1,<2",
  "langchain>=1.3,<2",
  "langchain-openai>=1.4,<2",
  "langgraph>=1.2,<2",
  "numpy>=2.2,<2.3; python_version < '3.11'",
  "numpy>=2.3,<3; python_version >= '3.11'",
  "fastapi>=0.141,<1",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dspy = ["dspy>=3.2,<4"]
agents = ["openai-agents>=0.6,<1"]
dev = ["pytest>=9,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
